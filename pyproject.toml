[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenibot"
version = "0.1.0"
description = "Bot de gerenciamento de servidor e eventos para Discord"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    # Transitiva do discord.py, mas declarada porque __main__.py importa
    # aiohttp diretamente para classificar erros de rede.
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    # Front matter dos capítulos da base de conhecimento. Escrever um parser
    # à mão para YAML é fonte clássica de bug silencioso em citação.
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Integração: simula uma guild falsa e despacha eventos de Gateway.
    # Só cobre listeners — não tem suporte a slash commands nem componentes.
    "dpytest>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode=auto: testes async rodam sem precisar de decorador em cada um.
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Avisos emitidos pelo discord.py no import, fora do nosso controle.
    # Sem estas exceções, "error" transforma um aviso de terceiros em falha
    # de coleta e a suíte nem chega a rodar.
    # Python 3.14: asyncio.iscoroutinefunction virou depreciado.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # Python 3.12: audioop depreciado (removido no 3.13, onde o discord.py
    # passa a usar audioop-lts).
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

# Explícito: sem isto o setuptools tenta empacotar migrations/ e scripts/
# como se fossem pacotes de topo.
[tool.setuptools]
packages = ["zenibot", "zenibot.cogs", "zenibot.core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
